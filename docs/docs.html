<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentation — ESP32 Service Uptime Monitor</title>
  <meta name="description" content="Official documentation, hardware pinouts, setup guide, interactive Swagger/OpenAPI reference, and licensing terms for the ESP32 Service Uptime Monitor." />
  <link rel="canonical" href="https://esp32-service-uptime-monitor.com/readme.html" />
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const doc = params.get("doc") || "readme";
      const routes = {
        readme: "./readme.html",
        api: "./api/",
        contributing: "./contributing.html",
        changelog: "./changelog.html",
        license: "./license.html"
      };
      window.location.replace(routes[doc] || "./readme.html");
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./readme.html" />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="./styles.css" />
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PGXR4C43"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="./">
        <span class="status-dot" aria-hidden="true"></span>
        <span>ESP32 Service Uptime Monitor</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="./">Overview &amp; Flasher</a>
        <a href="./docs.html?doc=readme" data-nav="readme">Documentation</a>
        <a href="./docs.html?doc=api" data-nav="api">API (Swagger)</a>
        <a href="./docs.html?doc=contributing" data-nav="contributing">Contributing</a>
        <a href="./docs.html?doc=changelog" id="changelogNav" class="hidden" data-nav="changelog">Changelog</a>
        <a href="./docs.html?doc=license" data-nav="license">License</a>
        <a href="https://github.com/gyengus/esp32-service-uptime-monitor/releases" target="_blank" rel="noopener">Releases</a>
        <a href="https://github.com/gyengus/esp32-service-uptime-monitor" target="_blank" rel="noopener">GitHub</a>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container docs-layout">
    <article id="docContent" class="markdown-body" aria-live="polite">
      <p>Loading document…</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="./">Overview &amp; Flasher</a>
        <a href="./docs.html?doc=readme" data-nav="readme">Documentation</a>
        <a href="./docs.html?doc=api" data-nav="api">API (Swagger)</a>
        <a href="./docs.html?doc=contributing" data-nav="contributing">Contributing</a>
        <a href="./docs.html?doc=changelog" id="changelogFooterNav" class="hidden" data-nav="changelog">Changelog</a>
        <a href="./docs.html?doc=license" data-nav="license">License</a>
        <a href="https://github.com/gyengus/esp32-service-uptime-monitor/releases" target="_blank" rel="noopener">Releases</a>
        <a href="https://github.com/gyengus/esp32-service-uptime-monitor" target="_blank" rel="noopener">GitHub</a>
        <span class="footer-author">Created by <a href="https://gyengus.hu/?utm_source=uptimeMonitorPage" target="_blank" rel="noopener">Gyengus</a></span>
      </div>
    </div>
  </footer>

  <script>
    const DOCS = {
      readme: {
        title: "Documentation — ESP32 Service Uptime Monitor",
        prerendered: "./readme.html",
        paths: ["./content/README.md", "../README.md"],
        rawUrl: "https://github.com/gyengus/esp32-service-uptime-monitor/blob/master/README.md",
        type: "markdown"
      },
      api: {
        title: "API Documentation (Swagger) — ESP32 Service Uptime Monitor",
        type: "swagger"
      },
      contributing: {
        title: "Contributing — ESP32 Service Uptime Monitor",
        prerendered: "./contributing.html",
        paths: ["./content/CONTRIBUTING.md", "../CONTRIBUTING.md"],
        rawUrl: "https://github.com/gyengus/esp32-service-uptime-monitor/blob/master/CONTRIBUTING.md",
        type: "markdown"
      },
      changelog: {
        title: "Changelog — ESP32 Service Uptime Monitor",
        prerendered: "./changelog.html",
        paths: ["./content/CHANGELOG.md", "../CHANGELOG.md"],
        rawUrl: "https://github.com/gyengus/esp32-service-uptime-monitor/blob/master/CHANGELOG.md",
        type: "markdown"
      },
      license: {
        title: "License — ESP32 Service Uptime Monitor",
        prerendered: "./license.html",
        paths: ["./content/LICENSE", "../LICENSE"],
        rawUrl: "https://github.com/gyengus/esp32-service-uptime-monitor/blob/master/LICENSE",
        type: "plain"
      }
    };

    const contentEl = document.getElementById("docContent");
    const changelogNav = document.getElementById("changelogNav");

    function getActiveDocKey() {
      const params = new URLSearchParams(window.location.search);
      const key = (params.get("doc") || "readme").toLowerCase();
      return DOCS[key] ? key : "readme";
    }

    async function fetchFirstAvailable(paths) {
      for (const path of paths) {
        try {
          const res = await fetch(path);
          if (res.ok) return await res.text();
        } catch {
          // Try next path
        }
      }
      return null;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function renderDoc(key, pushState = false) {
      const spec = DOCS[key];
      document.title = spec.title;
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "doc_view", doc_key: key });

      document.querySelectorAll("header [data-nav]").forEach((a) => {
        if (a.dataset.nav === key) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });

      if (pushState) {
        const url = new URL(window.location);
        url.searchParams.set("doc", key);
        window.history.pushState({}, "", url);
      }

      if (spec.type === "swagger") {
        contentEl.classList.add("is-swagger");
        contentEl.innerHTML = '<iframe id="swaggerFrame" class="swagger-iframe" src="./api/index.html" title="API Documentation (Swagger UI)"></iframe>';
        const frame = document.getElementById("swaggerFrame");
        frame.addEventListener("load", () => {
          try {
            const doc = frame.contentDocument || frame.contentWindow.document;
            const updateHeight = () => {
              if (doc && doc.body) {
                frame.style.height = Math.max(780, doc.body.scrollHeight + 24) + "px";
              }
            };
            updateHeight();
            if (window.ResizeObserver && doc && doc.body) {
              new ResizeObserver(updateHeight).observe(doc.body);
            }
          } catch {
            // Fallback to default min-height if cross-origin restrictions apply
          }
        });
        return;
      }

      contentEl.classList.remove("is-swagger");
      contentEl.innerHTML = "<p>Loading document…</p>";

      // 1. Try pre-rendered HTML first (fast, fully resolved links, SEO-consistent)
      if (spec.prerendered) {
        try {
          const preRes = await fetch(spec.prerendered);
          if (preRes.ok) {
            const preHtml = await preRes.text();
            const docParser = new DOMParser();
            const parsedDoc = docParser.parseFromString(preHtml, "text/html");
            const renderedArticle = parsedDoc.getElementById("docContent");
            if (renderedArticle) {
              contentEl.innerHTML = renderedArticle.innerHTML;
              return;
            }
          }
        } catch {
          // Fall back to dynamic markdown rendering below
        }
      }

      const text = await fetchFirstAvailable(spec.paths);

      if (!text) {
        contentEl.innerHTML = `
          <div class="alert alert-warning">
            Could not load document locally.
            <a href="${spec.rawUrl}" target="_blank" rel="noopener">View on GitHub</a>.
          </div>`;
        return;
      }

      if (spec.type === "plain") {
        contentEl.innerHTML = `<h1>License</h1><pre><code>${escapeHtml(text)}</code></pre>`;
      } else if (window.marked) {
        contentEl.innerHTML = window.marked.parse(text);
      } else {
        contentEl.innerHTML = `<pre><code>${escapeHtml(text)}</code></pre>`;
      }
    }

    document.querySelectorAll("[data-nav]").forEach((link) => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        renderDoc(link.dataset.nav, true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    // Show Changelog nav item automatically once CHANGELOG.md exists
    fetchFirstAvailable(DOCS.changelog.paths).then((text) => {
      if (text) {
        changelogNav.classList.remove("hidden");
        const footerCl = document.getElementById("changelogFooterNav");
        if (footerCl) footerCl.classList.remove("hidden");
      }
    });

    // Theme toggle
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const THEME_KEY = "uptime-docs-theme";
    const SUN_SVG = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    const MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

    function getEffectiveTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.innerHTML = theme === "light" ? MOON_SVG : SUN_SVG;
    }

    applyTheme(getEffectiveTheme());
    themeToggle.addEventListener("click", () => {
      const next = getEffectiveTheme() === "light" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    window.addEventListener("popstate", () => renderDoc(getActiveDocKey(), false));
    renderDoc(getActiveDocKey(), false);
  </script>
</body>
</html>
