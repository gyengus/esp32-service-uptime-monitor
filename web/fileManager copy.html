<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Fájlrendszer Kezelő</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #eef2f3; padding: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f9f9f9; }
        button { padding: 5px 10px; margin-left: 5px; }
        .btn-del { background: #ff4d4d; color: white; }
        .btn-del:hover { background: #cc0000; }
        .btn-main { background: #4CAF50; color: white; }
        .btn-main:hover { background: #45a049; }
        input[type="text"], input[type="file"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .file-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px; 
            border-bottom: 1px solid #ccc; 
        }
        .folder { color: #007bff; cursor: pointer; font-weight: bold; }
        .file { color: #333; }
    </style>
</head>
<body>

<div class="card">
    <h2>📁 ESP32-S3 SD_MMC Kezelő - <span id="current-path-display">/</span></h2>
    
    <div class="action-bar">
        <div>
            <strong>Feltöltés ide:</strong>
            <input type="file" id="fileInput">
            <button class="btn-main" onclick="uploadFile()">Küldés</button>
        </div>
        <div style="margin-left: auto;">
            <input type="text" id="dirName" placeholder="Új mappa neve...">
            <button class="btn-main" onclick="createDir()">Létrehozás</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Név</th>
                <th>Méret</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="fileList">
            </tbody>
    </table>
</div>

<script>
    window.onload = loadFiles;

    let currentPath = "";

    function loadFiles() {
        fetch('/list?path=' + currentPath)
            .then(res => res.json())
            .then(data => {
                document.getElementById('current-path-display').innerText = currentPath ? currentPath : "/";
                const tbody = document.getElementById('fileList');
                tbody.innerHTML = '';
                if (currentPath !== "") {
                    const backRow = `<tr>
                        <td colspan="3">
                            <button onclick="goBack()">.. [Vissza]</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += backRow;
                }
                data.forEach(file => {
                    const row = '<tr>'
                        + '<td' + (file.isDir ? ' onclick="changeDirectory(\'' + file.name + '\')">📁 <span class="folder">' + file.name  + '</span>' : '> 📄 <span class="file">' + file.name + '</span>') + '</td>'
                        + '<td>' + (file.isDir ? '[DIR]' : (file.size / 1024).toFixed(1) + ' KB') + '</td>'
                        + '<td><button class="btn-del" onclick="deleteItem(\'' + file.name + '\')">Törlés</button></td>'
                        + '</tr>';
                    tbody.innerHTML += row;
                });
            });
    }

    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return;
        
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        fetch('/upload?path=' + currentPath, { method: 'POST', body: formData })
            .then(() => { alert('Kész!'); loadFiles(); });
    }

    function createDir() {
        const name = document.getElementById('dirName').value;
        if (!name) return;
        fetch('/mkdir?dir=' + encodeURIComponent(name), { method: 'POST' })
            .then(() => { loadFiles(); document.getElementById('dirName').value = ''; });
    }

    function deleteItem(name) {
        if (confirm('Biztosan törlöd: ' + name + '?')) {
            fetch('/delete?file=' + encodeURIComponent(name) + '&path=' + encodeURIComponent(currentPath),  { method: 'DELETE' })
                .then(() => loadFiles());
        }
    }

    // Mappába való belépés
    function changeDirectory(folderName) {
        currentPath += "/" + folderName;
        loadFiles();
    }

    // Visszalépés a szülőmappába
    function goBack() {
        const parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/');
        loadFiles();
    }
</script>

</body>
</html>
