                        <span class="d-none d-sm-inline">ESP32 </span>Service Uptime Monitor
                    </h1>
                </a>
                
                <div id="navStats" class="d-flex gap-1 align-items-center">
                    <span id="filterAll" class="badge rounded-pill bg-secondary bg-opacity-25 border border-secondary text-light px-2 py-1" role="button">
                        <span class="mdi mdi-layers-outline d-none d-sm-inline"></span><span id="navTotal">--</span>
                    </span>
                    
                    <span id="filterOnline" class="badge rounded-pill bg-success bg-opacity-10 border border-success text-success px-2 py-1" role="button">
                        <span class="mdi mdi-check-circle-outline d-none d-sm-inline"></span> <span id="navOnline">--</span>
                    </span>
                    
                    <span id="filterOffline" class="badge rounded-pill bg-danger bg-opacity-10 border border-danger text-danger px-2 py-1" role="button">
                        <span class="mdi mdi-alert-circle-outline d-none d-sm-inline"></span> <span id="navOffline">--</span>
                    </span>
                </div>
            </div>

            <div class="d-flex align-items-center flex-shrink-0">
                <a href="/config" id="configButton" class="btn btn-sm btn-outline-light border-0 p-1" title="Settings" style="display: none;">
                    <span class="mdi mdi-cog mdi-24px"></span>
                </a>
                <button id="refreshButton" class="btn btn-sm btn-outline-light border-0 p-1" title="Refresh">
                    <span id="refreshIcon" class="mdi mdi-refresh mdi-24px"></span>
                </button>
            </div>

        </div>
    </nav>

    <div class="container-fluid" id="mainContainer">
        <div id="toastContainer" class="toast-container position-fixed top-0 end-0">
            <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            </div>

            <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            </div>
        </div>

        <div id="entityGrid" class="row g-4"></div>
    </div>

    <button type="button" class="btn btn-primary shadow-lg fab" id="addButton" title="Add entity">
        <span class="mdi mdi-plus mdi-36px"></span>
    </button>

    <div class="modal fade" id="entityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Entity</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="entityForm" class="needs-validation" novalidate>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label" for="name">Name</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="name" required />
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label" for="address">Address</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="address" placeholder="IP, hostname or url" required />
                            </div>
                        </div>
                        
                        <div class="mb-3 row">
                            <div class="col-sm-4 col-form-label">Monitoring Type</div>
                            <div class="col-sm-8 col-form-label">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="type" id="typePing" value="PING" checked />
                                    <label class="form-check-label" for="typePing">ICMP Ping</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="type" id="typeHead" value="HEAD" />
                                    <label class="form-check-label" for="typeHead">HTTP HEAD</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <div class="col-sm-4 col-form-label">Notifications</div>
                            <div class="col-sm-8 col-form-label">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="notificationsEnabled">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label" for="icon">Icon (MDI class)</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="icon" placeholder="mdi-server" />
                            </div>
                        </div>
                        <input type="hidden" id="id" value="" />
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete <strong id="deleteEntityNameDisplay"></strong>?</p>
                    <p class="text-muted small">This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 bg-dark text-white border-top border-secondary">
        <div class="container-fluid d-flex align-items-center justify-content-center justify-content-md-between">
            <div class="small text-secondary d-flex gap-2 gap-sm-3 align-items-center">
                <span>
                    <span class="mdi mdi-clock-outline me-1"></span><span id="uptimeVal">--</span>
                </span>
                <span>
                    <span class="mdi mdi-wifi me-1" id="rssiIcon"></span><span id="rssiVal">--</span>
                </span>
                <span>
                    <span class="mdi mdi-memory me-1"></span><span id="heapVal">--</span>
                </span>
                <span>
                    <span class="mdi mdi-thermometer me-1"></span><span id="tempVal">--</span>
                </span>
            </div>
            
            <div class="small text-secondary text-end d-none d-md-flex gap-3 align-items-center">
                <span>v<b id="versionVal" class="text-light">--</b></span>
                <span>Hash: <code id="commitVal" class="text-info">--</code></span>
                <span>Build: <span id="buildDateVal">--</span></span>
            </div>
        </div>
    </footer>

    <script src="static/bootstrap.min.js"></script>
    <script src="static/jquery-3.7.1.min.js"></script>
    <script src="static/app.js"></script>
  </body>
</html>
