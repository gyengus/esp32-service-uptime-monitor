<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Service Uptime Monitor</title>
    <link href="static/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link href="static/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar fixed-top bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand custom-brand text-decoration-none" href="/">
                <h1 class="m-0 h5 text-nowrap">ESP32 Service Uptime Monitor</h1>
            </a>
        </div>
    </nav>

    <div class="container" id="mainContainer">
        <div id="toastContainer" class="toast-container position-fixed top-0 end-0">
            <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            </div>

            <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            </div>
        </div>

        <div class="row justify-content-md-center">
            <div class="card shadow col-sm-9">
                <div class="card-body">
                    <h5 class="card-title">Configuration</h5>
                    <div class="card-text">
                        <form id="configForm" class="needs-validation" novalidate>
                            <div class="mb-3 row">
                                <label for="wifiSSID" class="col-sm-4 col-form-label">WiFi SSID</label>
                                <div class="col-sm-8">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="wifiSSID" required />
                                        <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center" id="scanWifiButton">
                                            <span id="btnIcon" class="mdi mdi-wifi me-1"></span>
                                            <span id="btnText" class="me-1">Scan</span>
                                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <div id="wifiNetworksContainer" class="col-sm-8 offset-sm-4 border rounded overflow-hidden" style="display: none;"></div>
                            </div>
                            <div class="mb-3 row">
                                <label for="wifiPassword" class="col-sm-4 col-form-label">WiFi password</label>
                                <div class="col-sm-8">
                                    <input type="password" class="form-control" id="wifiPassword" required />
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="sntpServer" class="col-sm-4 col-form-label">SNTP Server</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="sntpServer" value="" required />
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="offsetHours" class="col-sm-4 col-form-label">Timezone offset</label>
                                <div class="col-sm-8">
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="offsetHours" value="1" min="-11", max="11" />
                                        <span class="input-group-text">hours</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="checkInterval" class="col-sm-4 col-form-label">Check interval</label>
                                <div class="col-sm-8">
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="checkInterval" value="60" min="1" required />
                                        <span class="input-group-text">seconds</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="slackWebhook" class="col-sm-4 col-form-label">Slack webhook</label>
                                <div class="col-sm-8">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="slackWebhookURL" />
                                        <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center" id="testSlackButton">
                                            <span id="testSlackButtonIcon" class="mdi mdi-slack me-1"></span>
                                            <span id="testSlackButtonText" class="me-1">Test</span>
                                            <span id="testSlackButtonSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                        </button>
                                    </div>
                                    <div id="testSlackFeedback" class="form-text mt-2" style="display: none;"></div>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="hostname" class="col-sm-4 col-form-label">Device hostname</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="hostname" value="" required />
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <button type="button" class="btn btn-outline-secondary" id="backupButton">
                                    <span class="mdi mdi-content-save me-1"></span>
                                    <span class="me-1">Backup configuration</span>
                                </button>
                            </div>
                            <div class="mb-3 row" id="factoryResetRow" style="display: none;">
                                <button type="button" class="btn btn-outline-danger" id="factoryResetButton">Factory reset</button>
                            </div>
                            <div class="mb-3 row">
                                <button type="button" class="btn btn-primary" id="saveButton">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="factoryResetConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm factory reset</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you do want to factory reset the device?</p>
                    <p class="text-muted small">This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmFactoryResetButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/bootstrap.min.js"></script>
    <script src="static/jquery-3.7.1.min.js"></script>
    <script src="static/app.config.js"></script>
  </body>
</html>
