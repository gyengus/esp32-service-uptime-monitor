name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/**'
      - 'templates/**'
      - 'scripts/render_docs.py'
      - 'scripts/preview_site.py'
      - 'scripts/combine_coverage.py'
      - 'scripts/changelog.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deployment"
  cancel-in-progress: false

jobs:
  build-site:
    name: Assemble Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install markdown beautifulsoup4

      - name: Fetch latest release firmware binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          echo "[INFO] Attempting to download firmware binaries from latest release..."
          gh release download --repo "${{ github.repository }}" --pattern "*.bin" --dir dist || echo "[WARN] No release binaries found, proceeding with documentation only."

      - name: Assemble static documentation site
        run: python3 scripts/preview_site.py --build-only

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
