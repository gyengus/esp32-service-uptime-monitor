name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Web UI dependencies
        run: npm --prefix web ci

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO, PyYAML, markdown, beautifulsoup4
        run: |
          python -m pip install --upgrade pip
          pip install platformio pyyaml markdown beautifulsoup4

      - name: Build release firmware images for Web Flasher
        env:
          RELEASE: "1"
        run: pio run -t dist

      - name: Pre-render Markdown Documentation to Static HTML
        run: |
          python3 scripts/render_docs.py docs/

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/content _site/firmware
          cp -r docs/* _site/
          cp README.md CONTRIBUTING.md LICENSE _site/content/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md _site/content/ || true
          cp dist/*.bin _site/firmware/

          python3 - << 'EOF'
          import json
          import os
          from pathlib import Path

          dist_manifest = Path("dist/manifest.json")
          out_dir = Path("_site/firmware")

          if dist_manifest.exists():
              data = json.loads(dist_manifest.read_text(encoding="utf-8"))
              version = os.environ.get("GITHUB_SHA", "latest")[:7]
              # Write combined manifest
              data["version"] = version
              (out_dir / "manifest.json").write_text(json.dumps(data, indent=2), encoding="utf-8")

              # Write per-board manifests so variants sharing a chipFamily (e.g. esp32-s3 vs esp32-s3-cam) stay distinct
              for build in data.get("builds", []):
                  parts = build.get("parts", [])
                  if not parts:
                      continue
                  bin_path = parts[0].get("path", "")
                  env_name = bin_path.removesuffix(".bin")
                  board_manifest = {
                      "name": f"ESP32 Service Uptime Monitor ({env_name})",
                      "version": version,
                      "new_install_prompt_erase": True,
                      "builds": [build],
                  }
                  (out_dir / f"manifest-{env_name}.json").write_text(
                      json.dumps(board_manifest, indent=2),
                      encoding="utf-8",
                  )
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
