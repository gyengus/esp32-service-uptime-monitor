workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - security-scans
  - test
  - gemini-review
  - build
  - site

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'ai/ai-code-reviewer'
    ref: 'master'
    file: 'templates/ai-code-review.yml'

variables:
  SECRET_DETECTION_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, target, logs, .git, .mvn, .settings, .vscode"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.platformio"
  PLATFORMIO_CACHE_DIR: "$CI_PROJECT_DIR/.platformio/.cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

test:ui:
  stage: test
  image: node:24
  cache:
    key:
      prefix: "ui"
      files:
        - web/package-lock.json
    paths:
      - .npm/
      - web/node_modules/
  before_script:
    - npm --prefix web ci --prefer-offline
  script:
    - npm --prefix web run test:coverage
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\|\s+([\d\.]+)/'
  artifacts:
    paths:
      - web/coverage/
    expire_in: 1 week

test:firmware:
  stage: test
  image: python:3.11
  cache:
    key:
      prefix: "firmware-test"
      files:
        - platformio.ini
    paths:
      - .cache/pip/
      - .platformio/
      - .pio/libdeps/native/
  before_script:
    - pip install -U platformio
  script:
    - pio test -e native
    - python3 scripts/coverage.py | tee coverage.txt
  coverage: '/OVERALL TOTAL\s+\d+\s+\d+\s+([\d\.]+)%/'
  artifacts:
    paths:
      - coverage.txt
    expire_in: 1 week

build:
  stage: build
  image: python:3.11
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "test"
  needs:
    - test:ui
    - test:firmware
  cache:
    key:
      prefix: "firmware-build"
      files:
        - platformio.ini
    paths:
      - .cache/pip/
      - .platformio/
      - .pio/libdeps/
  before_script:
    - pip install -U platformio
  script:
    - pio run
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build:site:
  stage: site
  image: python:3.11
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "test"
  needs:
    - job: build
      artifacts: true
  cache:
    key:
      prefix: "site"
      files:
        - scripts/render_docs.py
    paths:
      - .cache/pip/
  before_script:
    - pip install markdown beautifulsoup4
  script:
    - python3 scripts/preview_site.py --build-only
  artifacts:
    paths:
      - _site/
    expire_in: 1 week

# Explicit overrides for security jobs to ensure they run in correct stages and MRs
semgrep-sast:
  stage: security-scans
  variables:
    SECURE_LOG_LEVEL: "debug"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

secret_detection:
  stage: security-scans
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
