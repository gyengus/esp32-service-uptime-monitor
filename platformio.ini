; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = ESP32 service uptime monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:git_version.py
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi 
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags = 
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_IPV4_ONLY=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_CACHE_WORKAROUND
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D TCP_MSS=1460
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_SEND_BUFFER_SIZE=4096
    -D CONFIG_ASYNC_TCP_REC_NODE_SIZE=1024
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D CONFIG_SDMMC_DMA_BUFFER_SIZE=16384
    -D CONFIG_FATFS_CACHE_SIZE=4096
    -D ASYNCWEBSERVER_REGEX
    -D MONITOR_SPEED=115200
    -D MIN_LOG_LEVEL=ELOG_LEVEL_DEBUG
    -D MEM_STATS_LOGGING
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    https://github.com/x821938/elog.git
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
