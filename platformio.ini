; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = ESP32 service uptime monitor
default_envs = esp32-s3-cam, esp32-s3, esp32, esp32-c3, esp32-c6, esp32-c5

[common]
platform = espressif32
framework = arduino
extra_scripts = 
    pre:scripts/git_version.py
    pre:scripts/feature_flags.py
    pre:scripts/generate_openapi.py
    pre:scripts/generate_web_embed.py
    post:scripts/pio_ota_targets.py
    post:scripts/export_dist.py
monitor_speed = 115200
build_flags = 
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    -D CONFIG_ASYNC_TCP_IPV4_ONLY=1
    -D TCP_MSS=1460
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -D CONFIG_ASYNC_TCP_SEND_BUFFER_SIZE=4096
    -D CONFIG_ASYNC_TCP_REC_NODE_SIZE=1024
    -D ASYNCWEBSERVER_REGEX
    -D MONITOR_SPEED=115200
    -D MIN_LOG_LEVEL=ELOG_LEVEL_DEBUG
    -D MEM_STATS_LOGGING
    ; -D DISABLE_FILE_MANAGER ; Uncomment to exclude File Manager from build
    ; -D DISABLE_MEM_STATS_LOGGING ; Uncomment to exclude memory statistics logging
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    https://github.com/x821938/elog.git
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    bitbank2/unzipLIB @ ^1.0.0

[esp32-s3-base]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qio_opi 
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags = 
    ${common.build_flags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_CACHE_WORKAROUND
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 CAM board with SD card slot (SD_MMC)
[env:esp32-s3-cam]
extends = esp32-s3-base
build_flags = 
    ${esp32-s3-base.build_flags}
    -D BOARD_ESP32_S3_CAM
    -D CONFIG_SDMMC_DMA_BUFFER_SIZE=16384
    -D CONFIG_FATFS_CACHE_SIZE=4096

; ESP32-S3 board without SD card slot (uses internal flash via LittleFS)
[env:esp32-s3]
extends = esp32-s3-base
board_build.filesystem = littlefs
build_flags = 
    ${esp32-s3-base.build_flags}
    -D BOARD_ESP32_S3

; Classic ESP32 dual-core board (ESP32-WROOM-32 / NodeMCU-32S / DevKitC, 4MB Flash)
[env:esp32]
extends = common
board = esp32dev
board_build.partitions = partitions_4MB.csv
board_build.filesystem = littlefs
build_flags = 
    ${common.build_flags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D BOARD_ESP32_WROOM

; Modern single-core RISC-V board (ESP32-C3 SuperMini / DevKitM-1, 4MB Flash)
[env:esp32-c3]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions_4MB.csv
board_build.filesystem = littlefs
build_flags = 
    ${common.build_flags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D BOARD_ESP32_C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Modern single-core RISC-V board with Wi-Fi 6 (ESP32-C6 DevKitM-1 / DevKitC-1, 4MB Flash)
[env:esp32-c6]
extends = common
board = esp32-c6-devkitm-1
board_build.partitions = partitions_4MB.csv
board_build.filesystem = littlefs
build_flags = 
    ${common.build_flags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D BOARD_ESP32_C6
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Modern single-core RISC-V board with Dual-Band 2.4/5GHz Wi-Fi 6 (ESP32-C5 DevKitC-1, 4MB Flash)
[env:esp32-c5]
extends = common
board = esp32-c5-devkitc-1
board_build.partitions = partitions_4MB.csv
board_build.filesystem = littlefs
build_flags = 
    ${common.build_flags}
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D BOARD_ESP32_C5
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-cam-ota]
extends = env:esp32-s3-cam
upload_protocol = custom

[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = custom

[env:esp32-ota]
extends = env:esp32
upload_protocol = custom

[env:esp32-c3-ota]
extends = env:esp32-c3
upload_protocol = custom

[env:esp32-c6-ota]
extends = env:esp32-c6
upload_protocol = custom

[env:esp32-c5-ota]
extends = env:esp32-c5
upload_protocol = custom

[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts =
    pre:scripts/feature_flags.py
    pre:scripts/generate_web_embed.py
    post:scripts/coverage.py
build_src_filter =
    -<*>
    +<HostnameUtils.cpp>
    +<MonitoredEntity.cpp>
    +<MonitoredEntityRepository.cpp>
    +<Config.cpp>
    +<Storage.cpp>
    +<NotificationService.cpp>
    +<MonitoringService.cpp>
    +<WebArchiveExtractor.cpp>
    +<EmbeddedWebArchive.cpp>
    +<Api.cpp>
    +<SystemInfo.cpp>
    +<LedService.cpp>
    +<WsService.cpp>
    +<WsLogStream.cpp>
    +<../lib/NetworkContext/src/NetworkContext.cpp>
build_flags =
    -std=gnu++17
    -I test/mocks
    -I lib/NetworkContext/include
    -I lib/FileManager/include
    -D UNIT_TEST
    --coverage
    -lgcov
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -D DEFAULT_HOSTNAME=\"esp32-service-uptime-monitor\"
    -D DEFAULT_SNTP_SERVER=\"pool.ntp.org\"
    -D DEFAULT_TIMEZONE_OFFSET_HOURS=1
    -D DEFAULT_CHECK_INTERVAL_SECONDS=60
    -D DEFAULT_LED_BRIGHTNESS=50
    -D HTTP_REQUEST_RETRIES=3
    -D DISCORD_COLOR_BLUE=3447003
    -D DISCORD_COLOR_GREEN=1677332
    -D DISCORD_COLOR_RED=14431557
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    fabiobatsilva/ArduinoFake @ ^0.4.0
